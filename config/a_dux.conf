CONFIG_ZMK_KEYBOARD_NAME="kalmar_kbd"

CONFIG_ZMK_POINTING=y

# ms (default 900_000 == 15 min)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
CONFIG_ZMK_SLEEP=y

#                   === Bluetooth ===
#
# Boost BLE TX power to +8dBm — strengthens half<->half and half<->host link in noisy RF
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Use 1M PHY (disable 2M) — more robust against 2.4GHz congestion
# CONFIG_BT_CTLR_PHY_2M=n
